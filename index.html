<!-- UPDATED REGISTRATION FORM HTML -->
<div class="reg-section active" id="regSectionMobile">
  <div class="reg-title">Register for this event</div>
  <p class="reg-note">Enter your email to verify active plans or complete registration.</p>
  
  <input type="email" class="reg-input" id="regEmailMobile" placeholder="Email address *" autocomplete="email">
  <input type="text" class="reg-input" id="regNameMobile" placeholder="Full name *" autocomplete="name">
  <input type="tel" class="reg-input" id="regPhoneMobile" placeholder="Phone number *" autocomplete="tel">

  <!-- PAYMENT TYPE SELECTOR -->
  <div class="pay-section">
    <div class="pay-title">Payment Type</div>
    <div class="pay-options">
      <label class="pay-option">
        <input type="radio" name="payTypeMobile" value="single" checked> Single Class (Drop-In)
      </label>
      <label class="pay-option">
        <input type="radio" name="payTypeMobile" value="monthly"> Monthly Class Plan
      </label>
      <label class="pay-option">
        <input type="radio" name="payTypeMobile" value="current"> Already Paid / Current Plan
      </label>
    </div>
  </div>

  <!-- SINGLE CLASS AMOUNT -->
  <div id="singlePayBlock" style="margin-top:10px;">
    <label class="reg-label">Payment Amount ($)</label>
    <input type="number" class="reg-input" id="singleAmountMobile" min="0" step="1">
    <div class="reg-note">Defaulted to minimum class rate. You may add an optional contribution.</div>
  </div>

  <!-- MONTHLY TIER SELECTOR -->
  <div id="monthlyPayBlock" style="display:none; margin-top:10px;">
    <label class="reg-label">Monthly Plan Tier</label>
    <select class="reg-input" id="planTierMobile">
      <option value="1 hour/week">1 hour/week – $65/month</option>
      <option value="1.5 hours/week">1.5 hours/week – $85/month</option>
      <option value="2 hours/week">2 hours/week – $100/month</option>
      <option value="2.5 hours/week">2.5 hours/week – $120/month</option>
      <option value="3 hours/week">3 hours/week – $135/month</option>
      <option value="3.5 hours/week">3.5 hours/week – $150/month</option>
      <option value="4 hours/week">4 hours/week – $160/month</option>
      <option value="4.5 hours/week">4.5 hours/week – $170/month</option>
      <option value="5 hours/week">5 hours/week – $185/month</option>
      <option value="5.5 hours/week">5.5 hours/week – $200/month</option>
      <option value="6 hours/week">6 hours/week – $215/month</option>
    </select>
    <div id="feeBreakout" class="reg-note" style="font-weight:600; color:var(--ink);"></div>
  </div>

  <!-- PLAN STATUS BANNER -->
  <div id="planStatusBanner" style="display:none; margin-top:10px; padding:10px; border-radius:6px; font-size:13px;"></div>

  <!-- PAYMENT METHOD SELECTOR -->
  <div class="pay-section" id="methodSection">
    <div class="pay-title">Payment Method</div>
    <div class="pay-options">
      <label class="pay-option"><input type="radio" name="payMethodMobile" value="square" checked> Card via Square</label>
      <label class="pay-option"><input type="radio" name="payMethodMobile" value="zelle"> Zelle</label>
      <label class="pay-option"><input type="radio" name="payMethodMobile" value="cash"> Cash</label>
      <label class="pay-option"><input type="radio" name="payMethodMobile" value="check"> Check</label>
    </div>
  </div>

  <button class="reg-submit" id="regSubmitMobile">Register</button>
  <div class="reg-success" id="regSuccessMobile"></div>
  <div class="reg-error" id="regErrorMobile"></div>
</div>

<script>
// --- FRONTEND JAVASCRIPT LOGIC ---
function wireMobileForm(ev) {
  var email = document.getElementById('regEmailMobile');
  var basePrice = validCost(ev.cost) || 0;
  var singleInput = document.getElementById('singleAmountMobile');
  
  singleInput.value = basePrice;
  singleInput.min = basePrice;

  // Handle Dynamic Payment Type Block Visibility
  document.querySelectorAll('input[name="payTypeMobile"]').forEach(function(r) {
    r.addEventListener('change', function() {
      var val = this.value;
      document.getElementById('singlePayBlock').style.display = (val === 'single') ? 'block' : 'none';
      document.getElementById('monthlyPayBlock').style.display = (val === 'monthly') ? 'block' : 'none';
      document.getElementById('methodSection').style.display = (val === 'current') ? 'none' : 'block';
      document.getElementById('planStatusBanner').style.display = 'none';

      if (val === 'current') {
        validateCurrentPlan();
      } else if (val === 'monthly') {
        calculateFees();
      }
    });
  });

  document.getElementById('planTierMobile').addEventListener('change', calculateFees);

  function calculateFees() {
    var emailV = email.value.trim();
    var tier = document.getElementById('planTierMobile').value;
    
    apiPost({ action: 'calculateRegistrationFee', email: emailV, paymentType: 'monthly', planTier: tier })
      .then(function(res) {
        if (res.success) {
          var breakout = "Total: $" + res.totalDue;
          if (res.isProrated) breakout += " (Prorated 50% for mid-month)";
          if (res.isFirstTime) breakout += " + $25 One-Time Reg Fee";
          document.getElementById('feeBreakout').textContent = breakout;
        }
      });
  }

  function validateCurrentPlan() {
    var emailV = email.value.trim();
    var banner = document.getElementById('planStatusBanner');
    var submitBtn = document.getElementById('regSubmitMobile');

    if (!emailV) {
      banner.style.display = 'block';
      banner.style.background = '#fff3cd';
      banner.style.color = '#856404';
      banner.textContent = 'Please enter your email address above to validate your active plan.';
      submitBtn.disabled = true;
      return;
    }

    banner.style.display = 'block';
    banner.style.background = '#e2e3e5';
    banner.style.color = '#383d41';
    banner.textContent = 'Checking plan status...';

    apiPost({ action: 'checkPlanStatus', email: emailV, instanceId: ev.instanceId })
      .then(function(res) {
        banner.textContent = res.message;
        if (res.valid) {
          banner.style.background = '#d4edda';
          banner.style.color = '#155724';
          submitBtn.disabled = false;
        } else {
          banner.style.background = '#f8d7da';
          banner.style.color = '#721c24';
          submitBtn.disabled = true;
        }
      });
  }

  email.addEventListener('blur', function() {
    var type = document.querySelector('input[name="payTypeMobile"]:checked').value;
    if (type === 'current') validateCurrentPlan();
    if (type === 'monthly') calculateFees();
  });
}
</script>
