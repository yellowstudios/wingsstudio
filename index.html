<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wings to Fly — Schedule</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin />
  <link rel="dns-prefetch" href="https://script.google.com" />
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    :root{--accent:#c89b3c;--ink:#222;--muted:#777;--line:#e5e5e5;--bg:#fafafa;}
    *{box-sizing:border-box;}
    html,body{width:100%;margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    body{overflow:auto;}
    body.standalone-mode .toolbar, body.standalone-mode .page-section, body.standalone-mode .calendar-sessions-spacer { display:none !important; }
    body.standalone-mode .modal-overlay { position:static; background:none; display:block; padding:20px 12px; }
    body.standalone-mode .modal-container { max-width:650px; box-shadow:none; border:1px solid var(--line); }
    body.standalone-mode .modal-close { display:none; }

    .toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;}
    .toolbar .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .toolbar button.nav-btn{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;background:#fff;cursor:pointer;}
    .toolbar button.nav-btn:hover{background:#f0f0f0;}
    .toolbar button.nav-btn:disabled{opacity:.5;cursor:default;}
    .toolbar .week-label{font-weight:600;font-size:15px;}
    .toolbar .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .toolbar .view-toggle button,.toolbar .tabs button{font:inherit;font-size:13px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);}
    .toolbar .view-toggle button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
    .toolbar .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
    .toolbar .divider{width:1px;height:24px;background:var(--line);}

    .week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:12px;}
    .day-column{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:380px;display:flex;flex-direction:column;min-width:0;}
    .day-column.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
    .day-header{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;background:#fcfaf5;border-radius:8px 8px 0 0;}
    .day-name{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
    .day-num{font-size:18px;font-weight:600;}
    .day-events{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;}
    .no-events{color:#bbb;text-align:center;font-size:13px;padding:14px 0;}

    .event-card{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;font-size:12px;min-width:0;}
    .event-time{color:var(--muted);font-size:11px;margin-bottom:2px;}
    .event-title{font-weight:600;font-size:13px;margin-bottom:2px;word-wrap:break-word;}
    .event-location{color:var(--muted);font-size:11px;margin-bottom:4px;word-wrap:break-word;}
    .event-meta{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap;}
    .event-cost{font-weight:600;color:var(--ink);}
    .event-spots{font-style:italic;}
    .btn-register{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;border:none;font:inherit;font-size:12px;font-weight:600;padding:6px 8px;border-radius:5px;cursor:pointer;margin-bottom:4px;}
    .btn-register:hover{opacity:.9;}
    .btn-info{display:block;width:100%;text-align:center;background:#fff;color:var(--ink);border:1px solid var(--line);font:inherit;font-size:12px;font-weight:600;padding:6px 8px;border-radius:5px;cursor:pointer;}
    .btn-info:hover{background:#f0f0f0;}

    .month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px;}
    .month-day-header{background:#fcfaf5;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 0;}
    .month-cell{background:#fff;min-height:90px;padding:4px;display:flex;flex-direction:column;cursor:pointer;}
    .month-cell:hover{background:#fdf9f0;}
    .month-cell.today .month-cell-num{background:var(--accent);color:#fff;border-radius:50%;}
    .month-cell.other-month .month-cell-num{color:#ccc;}
    .month-cell-num{font-size:13px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;flex-shrink:0;}
    .month-event-pill{font-size:10px;background:var(--accent);color:#fff;border-radius:3px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .month-more{font-size:10px;color:var(--muted);padding:1px 4px;}

    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:99999;padding:12px;overflow-y:auto;}
    .modal-overlay.active{display:flex;}
    .modal-container{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.25);position:relative;margin:auto;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
    .modal-title{font-size:18px;font-weight:800;color:var(--ink);margin:0;}
    .modal-close{font-size:26px;line-height:1;cursor:pointer;color:var(--muted);border:none;background:none;padding:0;}

    .loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;font-size:14px;color:var(--muted);z-index:9998;pointer-events:none;}
    .loading-overlay.active{display:flex;}

    .modal-img{width:100%;max-height:450px;object-fit:contain;border-radius:8px;margin-bottom:14px;display:none;background:#f5f5f5;}
    .modal-img.show{display:block;}
    .modal-row{display:flex;gap:8px;margin-bottom:8px;font-size:13px;}
    .modal-label{font-weight:600;color:var(--ink);white-space:nowrap;min-width:80px;}
    .modal-value{color:var(--muted);}
    .modal-divider{border:none;border-top:1px solid var(--line);margin:16px 0;}
    .modal-subtitle{font-size:13px;color:var(--muted);margin-bottom:6px;}
    .reg-section.active{display:block;}
    .reg-title{font-weight:600;font-size:14px;margin-bottom:6px;}
    .reg-note{font-size:12px;color:var(--muted);margin-bottom:10px;}
    .reg-label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px;display:block;}
    .reg-input{width:100%;padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;}
    .reg-input:focus{outline:none;border-color:var(--accent);}
    .reg-submit{width:100%;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:2px;}
    .reg-submit:disabled{opacity:.5;cursor:not-allowed;}
    .reg-success{color:#2e7d32;font-size:13px;margin-top:10px;text-align:center;font-weight:600;}
    .reg-error{color:#c0392b;font-size:13px;margin-top:10px;text-align:center;}

    .qty-control-wrapper { display:flex; align-items:center; gap:8px; margin-top:4px; margin-bottom:12px; }
    .qty-btn { width:38px; height:38px; background:#fff; border:1px solid var(--line); border-radius:6px; font-size:18px; font-weight:700; cursor:pointer; color:var(--ink); }
    .qty-btn:hover { background:#f0f0f0; }
    .qty-input { width:60px; text-align:center; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:15px; font-weight:700; }

    .recognized-tooltip, .duplicate-block, #planStatusBanner, #exceededOptions { transition: opacity 0.25s ease-in-out; }
    .recognized-tooltip{display:none; background:#e8f5e9; border:1px solid #a5d6a7; color:#1b5e20; border-radius:6px; padding:8px 10px; font-size:12px; font-weight:600; margin-bottom:8px;}
    .duplicate-block{display:none; background:#e3f2fd; border:1px solid #90caf9; color:#0d47a1; border-radius:8px; padding:12px; font-size:13px; margin-top:10px;}

    .pay-section{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;}
    .pay-title{font-weight:600;font-size:14px;margin-bottom:6px;}
    .pay-options{display:flex;flex-direction:column;gap:8px;}
    .pay-option{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:6px;}
    .pay-option:hover{background:#fdf9f0;}
    .pay-option input[type=radio]{accent-color:var(--accent);width:16px;height:16px;}
    .protected-tier{display:none;}
    .protected-tier.unlocked{display:flex; animation:fadeIn 0.3s ease-in;}

    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

    .summary-card{background:#fcfaf5; border:1px solid var(--accent); border-radius:8px; padding:12px; margin-top:14px;}
    .summary-title{font-weight:700; font-size:13px; color:var(--ink); margin-bottom:6px;}
    .summary-row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
    .summary-total{display:flex; justify-content:space-between; font-weight:700; font-size:15px; border-top:1px solid var(--line); padding-top:6px; margin-top:6px;}

    .confirmation-view{text-align:center; padding:10px 0;}
    .confirm-icon{font-size:42px; color:#2e7d32; margin-bottom:8px;}
    .confirm-title{font-size:20px; font-weight:800; color:var(--ink); margin-bottom:6px;}
    .confirm-msg{font-size:14px; color:var(--muted); margin-bottom:16px;}
    .confirm-btns{display:flex; gap:10px; flex-wrap:wrap;}
    .confirm-btn{flex:1; padding:10px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer; border:1px solid var(--line); background:#fff;}
    .confirm-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}

    .page-section{padding:16px 16px 0;}
    .section-title{font-size:26px;line-height:1.15;font-weight:800;margin:0 0 6px;letter-spacing:-0.02em;}
    .section-subtitle{font-size:14px;color:var(--muted);margin:0 0 14px;line-height:1.5;}
    .calendar-sessions-spacer{height:24px;}
    .sessions-block{padding-top:8px;}
    .sessions-title{margin-top:6px;}

    @media(max-width:900px){
      .page-section{padding:14px 12px 0;}
      .section-title{font-size:22px;}
      .calendar-sessions-spacer{height:30px;}
      .week-grid{grid-template-columns:1fr;}
    }

    .sessions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
    .session-card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
    .session-card-img{width:100%;max-height:280px;object-fit:contain;background:#f5f5f5;display:block;}
    .session-card-body{padding:14px;flex:1;display:flex;flex-direction:column;}
    .session-card-category{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600;margin-bottom:4px;}
    .session-card-title{font-size:16px;font-weight:700;margin-bottom:6px;}
    .session-card-desc{font-size:13px;color:var(--muted);margin-bottom:10px;flex:1;line-height:1.5;}
    .session-card-cost{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px;}
    .session-card-toggle{font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:6px;padding:7px 12px;cursor:pointer;width:100%;}
    .session-card-toggle:hover{background:#fdf9f0;}
    .session-instances{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .session-instances.open{display:block;}
    .session-instance-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;}
    .session-instance-row:last-child{border-bottom:none;}
    .session-instance-date{font-size:13px;font-weight:600;}
    .session-instance-time{font-size:12px;color:var(--muted);}
    .session-instance-spots{font-size:12px;font-style:italic;color:var(--muted);}
    .session-instance-btn{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);white-space:nowrap;}
    .session-instance-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="nav">
      <button class="nav-btn" id="prevBtn">‹ Prev</button>
      <span class="week-label" id="periodLabel">Loading…</span>
      <button class="nav-btn" id="nextBtn">Next ›</button>
    </div>
    <div class="controls">
      <div class="view-toggle">
        <button id="viewWeek" class="active">Week</button>
        <button id="viewMonth">Month</button>
      </div>
      <div class="divider"></div>
      <div class="tabs">
        <button id="tabClasses" class="active">Classes &amp; Rehearsals</button>
        <button id="tabShows" class="active">Shows &amp; Events</button>
      </div>
    </div>
  </div>

  <div class="page-section">
    <h2 class="section-title">Our Calendar</h2>
    <p class="section-subtitle">Browse our schedule and reserve your space for any upcoming date.</p>
    <div id="calendarArea"></div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">Loading…</div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle"></h3>
        <button class="modal-close" id="modalCloseBtn">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="calendar-sessions-spacer"></div>

  <div class="page-section sessions-block">
    <h2 class="section-title sessions-title">Our Sessions</h2>
    <p class="section-subtitle">Browse our full program and reserve for any upcoming date.</p>
    <div id="sessionsArea"></div>
  </div>

  <script>
    var API = "https://script.google.com/macros/s/AKfycbxx7VLSm4Yib4MCuRAgBOnLIj2-BnE_GPNVsw0cgVqWNh3jDhvB94914DGxNTa9v7IU/exec";
    var STATIC_JSON_URL = "./calendar_data.json"; // Path to static staged JSON file
    var S = {view:'week',showClasses:true,showShows:true,currentMonday:mondayOf(new Date()),currentMonth:monthKey(new Date()),data:null,sessionsData:null,activeEv:null,cache:{}};
    var monthByDay = {}, eventMap = {};

    var ALL_TIERS = [
      { tier: '1 hour/week', mins: 60, rate: 65 },
      { tier: '1.5 hours/week', mins: 90, rate: 85 },
      { tier: '2 hours/week', mins: 120, rate: 100 },
      { tier: '2.5 hours/week', mins: 150, rate: 120 },
      { tier: '3 hours/week', mins: 180, rate: 135 },
      { tier: '3.5 hours/week', mins: 210, rate: 150 },
      { tier: '4 hours/week', mins: 240, rate: 160 },
      { tier: '4.5 hours/week', mins: 270, rate: 170 },
      { tier: '5 hours/week', mins: 300, rate: 185 },
      { tier: '5.5 hours/week', mins: 330, rate: 200 },
      { tier: '6 hours/week', mins: 360, rate: 215 }
    ];

    function mondayOf(date){var d=new Date(date); d.setHours(0,0,0,0); var day=d.getDay(), diff=day===0?-6:1-day; d.setDate(d.getDate()+diff); return d;}
    function addDays(date,n){var d=new Date(date); d.setDate(d.getDate()+n); return d;}
    function dateKey(date){var d=new Date(date); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
    function monthKey(date){var d=new Date(date); return d.getFullYear()+'-'+pad(d.getMonth()+1);}
    function pad(n){return String(n).padStart(2,'0');}
    function formatDuration(min){if(!min||isNaN(Number(min))) return ''; var m=Number(min); if(m<60) return m+' min'; if(m%60===0) return (m/60)+(m/60===1?' hour':' hours'); return Math.floor(m/60)+' hr '+(m%60)+' min';}
    function esc(str){var d=document.createElement('div'); d.textContent=String(str==null?'':str); return d.innerHTML;}
    function evKey(ev){return String(ev.instanceId||ev.id||'');}
    function registerEvent(ev){var k=evKey(ev); if(k) eventMap[k]=ev; return k;}
    
    function apiGet(params){
      var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&'); 
      return fetch(API+'?'+qs).then(function(r){if(!r.ok) throw new Error(r.status); return r.json();});
    }

    function apiPost(body){
      return fetch(API,{method:'POST', body: JSON.stringify(body)}).then(function(r){if(!r.ok) throw new Error(r.status); return r.json();});
    }

    function setLoading(on){document.getElementById('loadingOverlay').classList.toggle('active',!!on);document.getElementById('prevBtn').disabled=!!on;document.getElementById('nextBtn').disabled=!!on;}
    
    function getQueryParam(param) {
      var search = window.location.search || '';
      if (window.parent && window.parent !== window) {
        try { 
          search = window.parent.location.search || search; 
        } catch(e) {}
      }
      var match = RegExp('[?&]' + param + '=([^&]*)').exec(search);
      return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
    }

function checkDeepLink(){
  var reserveId = getQueryParam('reserve') || getQueryParam('event') || getQueryParam('instanceId');
  var isStandalone = getQueryParam('standalone') === 'true';
  
  if (isStandalone) {
    document.body.classList.add('standalone-mode');
  }

  if (reserveId) {
    var checkTimer = setInterval(function(){
      if (eventMap[reserveId]) {
        clearInterval(checkTimer);
        openModal(eventMap[reserveId], true);
      }
    }, 50);
    
    // Safety timeout after 5 seconds
    setTimeout(function(){ clearInterval(checkTimer); }, 5000);
  }
}

    function processPayloadData(data, cacheKey) {
      S.data = data; 
      S.cache[cacheKey] = data;
      try { localStorage.setItem(cacheKey, JSON.stringify(data)); } catch(e) {}

      if (data.sessionsPayload) {
        S.sessionsData = data.sessionsPayload;
        S.cache['sessions'] = data.sessionsPayload;
      }

      render(); 
      renderSessions();
      setLoading(false); 
      checkDeepLink();
    }

    function load(forceFresh){
      var cacheKey = S.view === 'month' ? 'month_' + S.currentMonth : 'week_' + dateKey(S.currentMonday);
      
      // 1. Instant Local Storage Hydration (0ms)
      var localData = localStorage.getItem(cacheKey);
      if (localData && !forceFresh && !S.data) {
        try {
          S.data = JSON.parse(localData);
          render();
        } catch(e) {}
      }

      if (!S.data) setLoading(true); 

      // 2. Fetch Static JSON for ultra-fast initial page load
      if (!forceFresh && S.view === 'week' && dateKey(S.currentMonday) === dateKey(mondayOf(new Date()))) {
        fetch(STATIC_JSON_URL + '?t=' + new Date().getTime())
          .then(function(r){
            if (!r.ok) throw new Error('Static file missing');
            return r.json();
          })
          .then(function(data){
            processPayloadData(data, cacheKey);
          })
          .catch(function(){
            // Fallback to Live Apps Script API if static file fails
            fetchLiveApi(cacheKey);
          });
      } else {
        fetchLiveApi(cacheKey);
      }
    }

    function fetchLiveApi(cacheKey) {
      var params = S.view === 'month' ? {month:S.currentMonth, includeSessions:'true'} : {week:dateKey(S.currentMonday), includeSessions:'true'}; 
      apiGet(params).then(function(data){
        if(!data || data.error){
          setLoading(false);
          return;
        }
        processPayloadData(data, cacheKey);
      }).catch(function(err){
        setLoading(false); 
      });
    }

    function loadSessions(){
      if(S.cache['sessions']){
        S.sessionsData = S.cache['sessions'];
        renderSessions();
        return;
      }
      apiGet({view:'sessions'}).then(function(data){
        S.sessionsData=data; 
        S.cache['sessions']=data;
        renderSessions();
        checkDeepLink();
      }).catch(function(){});
    }

    function render(){
      if (!S.data) return;
      document.getElementById('periodLabel').textContent=S.data.weekLabel||S.data.monthLabel||''; 
      document.getElementById('tabClasses').classList.toggle('active',S.showClasses); 
      document.getElementById('tabShows').classList.toggle('active',S.showShows); 
      var events=filteredEvents(); 
      if(S.view==='week') renderWeek(events); else renderMonth(events); 
      broadcastHeight();
    }

    function filteredEvents(){
      var evs=[]; 
      if(!S.data) return evs;
      if(S.showClasses && S.data.classes && Array.isArray(S.data.classes)) evs=evs.concat(S.data.classes); 
      if(S.showShows && S.data.shows && Array.isArray(S.data.shows)) evs=evs.concat(S.data.shows); 
      evs.sort(function(a,b){return (a.startMs||0)-(b.startMs||0);}); 
      return evs;
    }

    function parseDurationMinutes(durRaw) {
      if(!durRaw) return 60;
      if(typeof durRaw === 'number') return durRaw > 10 ? durRaw : Math.round(durRaw * 1440);
      var str = String(durRaw).trim();
      if(str.includes(':')) {
        var p = str.split(':');
        return (parseInt(p[0], 10) * 60) + parseInt(p[1], 10);
      }
      var num = parseInt(str, 10);
      return isNaN(num) ? 60 : num;
    }

    function getReserveButtonText(ev) {
      var typeLC = String(ev.type || '').toLowerCase();
      var catLC = String(ev.category || '').toLowerCase();
      if (typeLC === 'show' || typeLC === 'event' || catLC === 'performance') return 'Reserve Tickets';

    function renderWeek(events){
      events = events || [];
      var daysList = (S.data && S.data.days && Array.isArray(S.data.days)) ? S.data.days : [];
      var byDay={}; 
      daysList.forEach(function(d){byDay[d.key]=[];});
      
      (events || []).forEach(function(ev){ 
        if(ev && ev.dayKey && byDay[ev.dayKey]) { 
          registerEvent(ev); 
          byDay[ev.dayKey].push(ev); 
        } 
      });
      
      var html='<div class="week-grid">';
      daysList.forEach(function(d){
        var isToday=d.key===(S.data ? S.data.todayKey : '');
        var dayEvs=byDay[d.key] || [];
        var evHtml='';
        if(!dayEvs.length){evHtml='<div class="no-events">—</div>';}
        else{
          dayEvs.forEach(function(ev){
            var k=registerEvent(ev);
            var cardStyle = ev.isCancelled ? 'opacity:0.6;' : '';
            var btnText = getReserveButtonText(ev);
            var statusBadge = ev.statusLabel
              ? '<span style="display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;background:'+esc(ev.statusColor)+'1a;color:'+esc(ev.statusColor)+';border:1px solid '+esc(ev.borderColor||ev.statusColor)+';margin-bottom:4px;">'+esc(ev.statusLabel)+'</span>'
              : '';
            
            var isUpcoming = String(ev.status || '').trim().toLowerCase() === 'upcoming';
            var canRegister = ev.isPublic && !ev.isFull && !ev.isPast && isUpcoming;
            
            var btnHtml = '';
            if (canRegister) {
              btnHtml = '<button class="btn-register" data-id="'+esc(k)+'">'+btnText+'</button>';
            } else if (ev.isPast) {
              btnHtml = '<div style="font-size:11px;color:var(--muted);font-style:italic;margin-bottom:4px;text-align:center;">Event Completed</div>';
            } else if (!isUpcoming) {
              btnHtml = '<div style="font-size:11px;color:var(--muted);font-style:italic;margin-bottom:4px;text-align:center;">Registration Closed</div>';
            }

            evHtml += '<div class="event-card" data-evcard="1" style="'+cardStyle+'">'
              + statusBadge
              + '<div class="event-time">'+esc(ev.startTime)+' – '+esc(ev.endTime)+'</div>'
              + '<div class="event-title">'+esc(ev.title)+'</div>'
              + (ev.location ? '<div class="event-location">'+esc(ev.location)+'</div>' : '')

              + (ev.spotsText ? '<span class="event-spots">'+esc(ev.spotsText)+'</span>' : '')

              + btnHtml
              + '<button class="btn-info" data-id="'+esc(k)+'">More Info</button>'
              + '</div>';
          });
        }
        html += '<div class="day-column'+(isToday?' today':'')+'"><div class="day-header"><span class="day-name">'+d.name+'</span><span class="day-num">'+d.num+'</span></div><div class="day-events">'+evHtml+'</div></div>';

      html += '</div>';
      document.getElementById('calendarArea').innerHTML = html;
      attachCalendarListeners();

    function renderMonth(events){
      var daysList = (S.data && S.data.days && Array.isArray(S.data.days)) ? S.data.days : [];
      var byDay={}; 
      daysList.forEach(function(d){byDay[d.key]=[];});
      events.forEach(function(ev){ if(byDay[ev.dayKey]) { registerEvent(ev); byDay[ev.dayKey].push(ev); } });
      monthByDay=byDay;
      var currentMonthNum=parseInt(S.currentMonth.split('-')[1],10);
      var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      var html='<div class="month-grid">';

      daysList.forEach(function(d){

        var otherMonth=parseInt(d.monthNum,10)!==currentMonthNum;
        var dayEvs=byDay[d.key] || [];
        var pillsHtml='';
        var MAX=3;
        dayEvs.slice(0,MAX).forEach(function(ev){pillsHtml += '<div class="month-event-pill">'+esc(ev.startTime+' '+ev.title)+'</div>';});

        html += '<div class="month-cell'+(isToday?' today':'')+(otherMonth?' other-month':'')+'" data-key="'+esc(d.key)+'"><div class="month-cell-num">'+d.num+'</div>'+pillsHtml+'</div>';

      html += '</div>';
      document.getElementById('calendarArea').innerHTML = html;
      attachCalendarListeners();
    }

    function attachCalendarListeners(){
      var area=document.getElementById('calendarArea');
      if(!area || area.dataset.listenersAttached) return;
      area.dataset.listenersAttached='1';
      area.addEventListener('click', function(e){
        var btn = e.target.closest('.btn-register, .btn-info');
        if(btn){
          var ev = eventMap[btn.getAttribute('data-id')];
          if(!ev) return;
          openModal(ev, btn.classList.contains('btn-register'));
          return;
        }
        var cell=e.target.closest('.month-cell');
        if(!cell) return;
        openDayPanel(cell.getAttribute('data-key'), monthByDay[cell.getAttribute('data-key')] || []);
      });
    }

    function attachSessionListeners(){
      var area=document.getElementById('sessionsArea');
      if(!area || area.dataset.listenersAttached) return;
      area.dataset.listenersAttached='1';
      area.addEventListener('click', function(e){
        var toggle=e.target.closest('.session-card-toggle');
        if(toggle){
          var sid=toggle.getAttribute('data-sid');
          var panel=document.getElementById('si-'+sid);
          if(!panel) return;
          var open=panel.classList.toggle('open');
          var count=panel.querySelectorAll('.session-instance-row').length;
          toggle.textContent=open?'Hide dates':count+(count===1?' upcoming date':' upcoming dates')+' — view all';
          broadcastHeight();
          return;
        }
        var btn=e.target.closest('.btn-register, .btn-info');
        if(!btn) return;
        var ev=eventMap[btn.getAttribute('data-id')];
        if(!ev) return;
        openModal(ev, btn.classList.contains('btn-register'));
      });
    }

    function openDayPanel(dayKey, events){
      var parts=dayKey.split('-');
      var d=new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
      var titleStr = d.toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric"});
      
      document.getElementById('modalTitle').textContent = titleStr;
      var body = document.getElementById('modalBody');
      var html = '';
      if(!events.length){html = '<div style="color:var(--muted);text-align:center;padding:14px 0;font-size:14px;">No events this day.</div>';}
      else{
        events.forEach(function(ev){
          var k=registerEvent(ev);
          var btnText = getReserveButtonText(ev);
          html += '<div class="panel-event" style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;">'
            + '<div class="panel-event-time" style="font-size:12px;color:var(--muted);margin-bottom:2px;">'+esc(ev.startTime)+' – '+esc(ev.endTime)+'</div>'
            + '<div class="panel-event-title" style="font-weight:600;font-size:14px;margin-bottom:6px;">'+esc(ev.title)+'</div>'
            + '<div class="panel-btns" style="display:flex;gap:6px;flex-wrap:wrap;">'
            + (ev.isPublic && !ev.isFull ? '<button class="primary btn-register" data-id="'+esc(k)+'" style="flex:1;font:inherit;font-size:12px;font-weight:600;padding:6px 8px;border-radius:5px;cursor:pointer;border:none;background:var(--accent);color:#fff;">'+btnText+'</button>' : '')
            + '<button class="btn-info" data-id="'+esc(k)+'" style="flex:1;font:inherit;font-size:12px;font-weight:600;padding:6px 8px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);">More Info</button>'
            + '</div></div>';
        });
      }
      body.innerHTML = html;
      document.getElementById('modalOverlay').classList.add('active');
      attachModalDelegates(body);
    }

    function attachModalDelegates(root){
      root.addEventListener('click', function(e){
        var btn=e.target.closest('.btn-register, .btn-info');
        if(!btn) return;
        var ev=eventMap[btn.getAttribute('data-id')];
        if(!ev) return;
        openModal(ev, btn.classList.contains('btn-register'));

    }

    function dobMonthOptions(){
      var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
      return months.map(function(m,i){return '<option value="'+(i+1)+'">'+m+'</option>';}).join('');
    }
    function dobDayOptions(){
      var o=''; for(var d=1;d<=31;d++) o+='<option value="'+d+'">'+d+'</option>'; return o;
    }
    function dobYearOptions(){
      var o=''; var cur=new Date().getFullYear();
      for(var y=cur;y>=1920;y--) o+='<option value="'+y+'">'+y+'</option>'; return o;
    }

    function populateTierDropdown(currentTier, requiredMins) {
      var select = document.getElementById('planTierMobile');
      if (!select) return;
      select.innerHTML = '';

      var currentMins = 0;
      if (currentTier) {
        var match = ALL_TIERS.find(function(t){ return t.tier.toLowerCase() === currentTier.toLowerCase(); });
        if (match) currentMins = match.mins;
      }

      var targetMin = Math.max(currentMins + 1, requiredMins || 0);
      var filtered = ALL_TIERS.filter(function(t){ return t.mins >= targetMin; });
      if (filtered.length === 0) filtered = ALL_TIERS.filter(function(t){ return t.mins > currentMins; });

      filtered.forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t.tier;
        opt.textContent = t.tier + ' – $' + t.rate + '/month';
        select.appendChild(opt);
      });
    }

    function wireMobileForm(ev){
      var email=document.getElementById('regEmailMobile');
      var firstNameInput=document.getElementById('regFirstNameMobile');
      var lastNameInput=document.getElementById('regLastNameMobile');
      var phone=document.getElementById('regPhoneMobile');
      var submit=document.getElementById('regSubmitMobile');
      var tooltip=document.getElementById('recognizedTooltip');
      var dupBlock=document.getElementById('duplicateBlock');
      var mainFields=document.getElementById('mainFormFields');
      var extraInput=document.getElementById('extraContributionMobile');
      var promoInput=document.getElementById('promoCodeInput');
      var promoMsg=document.getElementById('promoCodeMsg');
      var qtyInput = document.getElementById('ticketQtyMobile');
      var qtyMinusBtn = document.getElementById('qtyMinusBtn');
      var qtyPlusBtn = document.getElementById('qtyPlusBtn');

      var emailTimer=null;
      var lastFetchedEmail = "";

      var currentUserCurrentTier = "";
      var currentUserRequiredMins = 0;

      var classMins = parseDurationMinutes(ev.duration);

      if (qtyInput) {
        qtyInput.addEventListener('input', updateItemizedSummary);
        if (qtyMinusBtn) {
          qtyMinusBtn.addEventListener('click', function(){
            var cur = Math.max(1, (parseInt(qtyInput.value, 10) || 1) - 1);

            updateItemizedSummary();
          });
        }
        if (qtyPlusBtn) {
          qtyPlusBtn.addEventListener('click', function(){
            var cur = (parseInt(qtyInput.value, 10) || 1) + 1;
            qtyInput.value = cur;
            updateItemizedSummary();
          });
        }
      }

      if (promoInput) {
        promoInput.addEventListener('input', function(){
          var val = this.value.trim().toLowerCase();
          var matched = false;
          document.querySelectorAll('.protected-tier').forEach(function(el){
            var pass = String(el.getAttribute('data-passcode') || '').toLowerCase();
            if (val && pass && val === pass) {
              el.classList.add('unlocked');
              var radio = el.querySelector('input[type="radio"]');
              if (radio) { radio.checked = true; }
              matched = true;
            } else {
              el.classList.remove('unlocked');
            }
          });

            if (matched) {
              promoMsg.style.display = 'block';
              promoMsg.style.color = '#2e7d32';
              promoMsg.textContent = '✓ Access code applied! Discount option unlocked.';

              promoMsg.style.display = 'block';
              promoMsg.style.color = '#c0392b';

            } else {
              promoMsg.style.display = 'none';
            }
          }

        });

      document.querySelectorAll('input[name="ticketTierMobile"]').forEach(function(r){

      });

      function updateItemizedSummary(){
        var sumType = document.getElementById('sumType');
        var sumBreakoutRow = document.getElementById('sumBreakoutRow');
        var sumBreakout = document.getElementById('sumBreakout');
        var sumTotal = document.getElementById('sumTotal');

        var extraVal = extraInput ? Number(extraInput.value) : 0;
        if(isNaN(extraVal) || extraVal < 0) extraVal = 0;

        var qty = qtyInput ? Math.max(1, parseInt(qtyInput.value, 10) || 1) : 1;

        if (hasTiers) {
          var selectedTier = document.querySelector('input[name="ticketTierMobile"]:checked');
          var tierPrice = selectedTier ? Number(selectedTier.value) : 0;
          var tierName = selectedTier ? selectedTier.getAttribute('data-name') : 'Ticket';
          
          sumType.textContent = (qty > 1 ? qty + 'x ' : '') + tierName;
          sumBreakoutRow.style.display = 'none';
          var tot = (tierPrice * qty) + extraVal;
          sumTotal.textContent = '$' + tot.toFixed(2);
          return;
        }

        var payTypeEl = document.querySelector('input[name="payTypeMobile"]:checked');
        var val = payTypeEl ? payTypeEl.value : 'single';

        if(val === 'single'){
          sumType.textContent = (qty > 1 ? qty + 'x Tickets ' : '') + 'Single Class (Drop-In)';
          sumBreakoutRow.style.display = 'none';
          var amt = singleInput ? Number(singleInput.value) : basePrice;
          if(amt < basePrice) amt = basePrice;
          var tot = (amt * qty) + extraVal;
          sumTotal.textContent = '$' + tot.toFixed(2);
        } else if(val === 'current'){
          sumType.textContent = 'Already Paid / Current Plan';
          sumBreakoutRow.style.display = 'none';
          sumTotal.textContent = extraVal > 0 ? '$' + extraVal.toFixed(2) + ' (Contribution)' : '$0.00 (Covered by Plan)';
        } else if(val === 'monthly'){
          var tierSelect = document.getElementById('planTierMobile');
          var tierVal = tierSelect && tierSelect.value ? tierSelect.value : '';
          sumType.textContent = 'Monthly Class Plan (' + tierVal + ')';
          sumBreakoutRow.style.display = 'flex';
          sumBreakout.textContent = document.getElementById('feeBreakout').textContent || 'Calculating...';
          var parsedTotal = document.getElementById('feeBreakout').textContent.match(/\$([0-9.]+)/);
          var baseTierAmt = parsedTotal ? Number(parsedTotal[1]) : 0;
          var tot = baseTierAmt + extraVal;
          sumTotal.textContent = '$' + tot.toFixed(2);
        }
      }

      if(email){
        email.addEventListener('input', function(){
          var v=this.value.trim();
          clearTimeout(emailTimer);
          if(v.length<5 || !v.includes('@')) {
            if (lastFetchedEmail && v !== lastFetchedEmail) {
              firstNameInput.value = ''; lastNameInput.value = ''; phone.value = '';
              tooltip.style.display = 'none';
              dupBlock.style.display = 'none';
              mainFields.style.display = 'block';
              lastFetchedEmail = "";
              currentUserCurrentTier = "";
              currentUserRequiredMins = classMins;
              populateTierDropdown('', classMins);
            }
            return;
          }
          emailTimer=setTimeout(function(){
            apiPost({action:'checkParticipant', email:v, instanceId:ev.instanceId}).then(function(r){
              if(r && r.exists){
                firstNameInput.value = r.firstName || ''; 
                lastNameInput.value  = r.lastName  || ''; 
                phone.value          = r.phone     || ''; 
                lastFetchedEmail = v;
                currentUserCurrentTier = r.currentTier || '';
                currentUserRequiredMins = r.requiredMins || classMins;

                tooltip.style.display = 'block';
                tooltip.textContent = "Welcome back, " + (r.firstName || 'Participant') + "! We've auto-filled your details.";

                if(r.alreadyRegistered){
                  dupBlock.style.display = 'block';
                  mainFields.style.display = 'none';
                  existingRegIdForCancel = r.existingRegId;

                  var dupText = '<strong>Already Reserved:</strong> ' + esc(r.firstName + ' ' + r.lastName) + ' is registered for this session.<br>'
                    + '<strong>Reservation ID:</strong> ' + esc(r.existingRegId) + '<br>'
                    + '<strong>Payment Type:</strong> ' + esc(r.existingPayType) + '<br>'
                    + '<strong>Payment Method:</strong> ' + esc(r.existingPayMethod);
                  document.getElementById('dupDetailsText').innerHTML = dupText;
                  return;
                } else {
                  dupBlock.style.display = 'none';
                  mainFields.style.display = 'block';
                }

                if(r.hasActivePlan && !hasTiers){
                  var rCurrent = document.getElementById('payTypeCurrent');
                  if(rCurrent){
                    rCurrent.checked = true;
                    rCurrent.dispatchEvent(new Event('change'));
                  }
                }
              } else if (lastFetchedEmail) {
                firstNameInput.value = ''; lastNameInput.value = ''; phone.value = '';
                tooltip.style.display = 'none';
                dupBlock.style.display = 'none';
                mainFields.style.display = 'block';
                lastFetchedEmail = "";
                currentUserCurrentTier = "";
                currentUserRequiredMins = classMins;
                populateTierDropdown('', classMins);
              }
            }).catch(function(){});
          },600);
        });

        email.addEventListener('blur', function(){
          var payTypeEl = document.querySelector('input[name="payTypeMobile"]:checked');
          var val = payTypeEl ? payTypeEl.value : 'single';
          if (val === 'current' && !hasTiers) validateCurrentPlan();
          if (val === 'monthly' && !hasTiers) calculateFees();
          updateItemizedSummary();
        });
      }

      var btnOpenCancel = document.getElementById('btnOpenCancelPrompt');
      if(btnOpenCancel) btnOpenCancel.addEventListener('click', function(){
        document.getElementById('cancelPromptArea').style.display = 'block';
        this.style.display = 'none';
      });

      var btnSubmitCancel = document.getElementById('btnSubmitCancel');
      if(btnSubmitCancel) btnSubmitCancel.addEventListener('click', function(){
        var reasonV = document.getElementById('cancelReasonInput').value.trim();
        var btn = this; btn.disabled = true; btn.textContent = 'Processing Cancellation...';
        apiPost({action:'cancelRegistration', registrationId:existingRegIdForCancel, reason:reasonV, email:email.value.trim()})
          .then(function(r){

                + '<div class="confirm-btns">'
                + '<button class="confirm-btn primary" id="btnConfirmCal">Back to Calendar</button>'
                + '</div>'
                + '</div>';
              
              document.getElementById('btnConfirmCal').addEventListener('click', function(){

              });

              alert(r.message || 'Could not cancel reservation.');

          });

      document.querySelectorAll('input[name="payTypeMobile"]').forEach(function(r){
        r.addEventListener('change', function(){
          var val = this.value;
          document.getElementById('singlePayBlock').style.display = (val === 'single') ? 'block' : 'none';
          document.getElementById('monthlyPayBlock').style.display = (val === 'monthly') ? 'block' : 'none';
          document.getElementById('methodSection').style.display = (val === 'current') ? 'none' : 'block';
          document.getElementById('planStatusBanner').style.display = 'none';
          document.getElementById('exceededOptions').style.display = 'none';

          if (val === 'monthly') {
            populateTierDropdown(currentUserCurrentTier, currentUserRequiredMins || classMins);
            calculateFees();
          } else if (val === 'current') {
            validateCurrentPlan();
          }
          updateItemizedSummary();
        });
      });

      var tierSelect = document.getElementById('planTierMobile');
      if (tierSelect) tierSelect.addEventListener('change', function(){
        calculateFees();
        updateItemizedSummary();
      });

      function calculateFees(){
        var emailV = email.value.trim();
        var tierSelect = document.getElementById('planTierMobile');
        var tier = tierSelect && tierSelect.value ? tierSelect.value : '';
        if(!tier) return;

        apiPost({ action: 'calculateRegistrationFee', email: emailV, paymentType: 'monthly', planTier: tier, baseClassPrice: basePrice })
          .then(function(res){
            if (res && res.success) {
              var breakout = "";
              if (res.isUpgrade) {
                breakout = "Upgrade from " + (res.currentTier || 'current plan') + " → " + tier + ". Total Due Today: $" + res.totalDue.toFixed(2);
                if (res.isProrated) breakout += " (Differential prorated 50% for mid-month upgrade)";
              } else {
                breakout = "Total Due Today: $" + res.totalDue.toFixed(2);
                if (res.isProrated) breakout += " (Prorated 50% for mid-month enrollment)";
                if (res.isFirstTime) breakout += " + $25 One-Time Registration Fee";
              }
              document.getElementById('feeBreakout').textContent = breakout;
              updateItemizedSummary();
            }
          }).catch(function(){});
      }

      function validateCurrentPlan(){
        var emailV = email.value.trim();
        var banner = document.getElementById('planStatusBanner');
        var exceededBlock = document.getElementById('exceededOptions');

        if (!emailV) {
          banner.style.display = 'block';
          banner.style.background = '#fff3cd';
          banner.style.color = '#856404';
          banner.textContent = 'Please enter your email address above to check active plan.';
          currentPlanValidStatus = false;
          return;
        }

        banner.style.display = 'block';
        banner.style.background = '#e2e3e5';
        banner.style.color = '#383d41';
        banner.textContent = 'Validating current plan with studio server...';
        exceededBlock.style.display = 'none';

        apiPost({ action: 'checkPlanStatus', email: emailV, instanceId: ev.instanceId })
          .then(function(res){
            banner.textContent = res.message;
            if (res && res.valid) {
              banner.style.background = '#d4edda';
              banner.style.color = '#155724';
              currentPlanValidStatus = true;
            } else if (res && res.status === 'EXCEEDED') {
              banner.style.background = '#f8d7da';
              banner.style.color = '#721c24';
              exceededBlock.style.display = 'block';
              currentPlanValidStatus = false;
              currentUserRequiredMins = res.requiredMins || classMins;
              currentUserCurrentTier = res.currentTier || '';
              
              populateTierDropdown(currentUserCurrentTier, currentUserRequiredMins);
            } else {
              banner.style.background = '#f8d7da';
              banner.style.color = '#721c24';
              currentPlanValidStatus = false;
            }
          }).catch(function(){
            banner.style.background = '#f8d7da';
            banner.style.color = '#721c24';
            banner.textContent = 'Server validation failed. Please try again.';
            currentPlanValidStatus = false;

      var btnDropIn = document.getElementById('btnSwitchDropIn');
      if (btnDropIn) btnDropIn.addEventListener('click', function(){
        var rSingle = document.querySelector('input[name="payTypeMobile"][value="single"]');
        if (rSingle) { rSingle.checked = true; rSingle.dispatchEvent(new Event('change')); }
      });

      var btnUpgrade = document.getElementById('btnSwitchUpgrade');
      if (btnUpgrade) btnUpgrade.addEventListener('click', function(){
        var rMonthly = document.querySelector('input[name="payTypeMobile"][value="monthly"]');
        if (rMonthly) { 
          rMonthly.checked = true; 
          rMonthly.dispatchEvent(new Event('change')); 
        }
      });

      document.querySelectorAll('input[name="payMethodMobile"]').forEach(function(r){
        r.addEventListener('change', function(){
          document.getElementById('squarePayBtnMobile').style.display='none';
          document.getElementById('zelleInfoMobile').style.display='none';
          document.getElementById('cashCheckInfoMobile').style.display='none';
          if(this.value==='square') document.getElementById('squarePayBtnMobile').style.display='block';
          else if(this.value==='zelle') document.getElementById('zelleInfoMobile').style.display='block';
          else if(this.value==='cash' || this.value==='check') document.getElementById('cashCheckInfoMobile').style.display='block';
        });
      });

      document.querySelectorAll('input[name="careOfCaregiverMobile"]').forEach(function(r){
        r.addEventListener('change', function(){
          document.getElementById('caregiverFieldsMobile').style.display = this.value==='yes' ? 'block' : 'none';
          if(this.value==='no'){document.getElementById('regCaregiverNameMobile').value=''; document.getElementById('regCaregiverPhoneMobile').value='';}
        });
      });

      document.querySelectorAll('input[name="accommodationsRequestedMobile"]').forEach(function(r){
        r.addEventListener('change', function(){
          document.getElementById('accommodationsFieldMobile').style.display = this.value==='yes' ? 'block' : 'none';
          if(this.value==='no') document.getElementById('regAccommodationsMobile').value='';
        });
      });

      updateItemizedSummary();

      submit.addEventListener('click', function(){
        var emailV=email.value.trim(), fNameV=firstNameInput.value.trim(), lNameV=lastNameInput.value.trim(), phoneV=phone.value.trim(), payMethodEl=document.querySelector('input[name="payMethodMobile"]:checked'), payMethodVal=payMethodEl ? payMethodEl.value : 'later', errEl=document.getElementById('regErrorMobile');
        var extraVal = extraInput ? Number(extraInput.value) : 0;
        var fullNameV = (fNameV + ' ' + lNameV).trim();
        var selectedAmount = basePrice;
        var payTypeVal = 'single';
        var selectedTierName = '';
        var ticketQty = qtyInput ? Math.max(1, parseInt(qtyInput.value, 10) || 1) : 1;

        if (hasTiers) {
          var selectedTier = document.querySelector('input[name="ticketTierMobile"]:checked');
          if (selectedTier) {
            selectedAmount = Number(selectedTier.value);
            selectedTierName = selectedTier.getAttribute('data-name');
          }
          payTypeVal = 'ticket_tier: ' + selectedTierName;
        } else {
          var payTypeEl=document.querySelector('input[name="payTypeMobile"]:checked');
          payTypeVal=payTypeEl ? payTypeEl.value : 'single';
        }

        errEl.textContent=''; document.getElementById('regSuccessMobile').textContent='';
        
        if(!hasTiers && payTypeVal === 'current' && !currentPlanValidStatus){
          errEl.textContent = 'You do not have an active monthly plan with available hours. Please select Single Class or Monthly Plan to reserve.';
          return;
        }

        if(!emailV || !fNameV || !lNameV){errEl.textContent='Please enter your email, first name, and last name.'; return;}
        if(!phoneV){errEl.textContent='Please enter your phone number.'; return;}

        var inclusionData=null;
        if(ev.inclusion){
          var careEl=document.querySelector('input[name="careOfCaregiverMobile"]:checked');
          var accEl=document.querySelector('input[name="accommodationsRequestedMobile"]:checked');
          var dobM=document.getElementById('regDobMonthMobile'), dobD=document.getElementById('regDobDayMobile'), dobY=document.getElementById('regDobYearMobile');
          var dob = (dobY && dobY.value && dobM && dobM.value && dobD && dobD.value)
            ? (String(dobM.value).length<2?'0':'')+dobM.value + '/' + (String(dobD.value).length<2?'0':'')+dobD.value + '/' + dobY.value : '';
          inclusionData={dob:dob, careOfCaregiver:careEl ? careEl.value==='yes' : false, caregiverName:document.getElementById('regCaregiverNameMobile').value.trim(), caregiverPhone:document.getElementById('regCaregiverPhoneMobile').value.trim(), accommodationsRequested:accEl ? accEl.value==='yes' : false, accommodations:document.getElementById('regAccommodationsMobile').value.trim()};
        }

        var btn=this; btn.disabled=true; btn.textContent='Submitting…';
        apiPost({
          action:'register', 
          instanceId:ev.instanceId, 
          name:fullNameV, 
          email:emailV, 
          phone:phoneV, 
          payMethod:payMethodVal, 
          payType:payTypeVal,
          singleAmount: selectedAmount * ticketQty,
          ticketQuantity: ticketQty,
          planTier: document.getElementById('planTierMobile') ? document.getElementById('planTierMobile').value : '',
          extraContribution: extraVal,
          inclusionData:inclusionData
        }).then(function(r){
          btn.disabled=false; btn.textContent=getReserveButtonText(ev);
          if(r && r.success){
            S.cache = {};
            var bodyHost = document.getElementById('modalBody');
            bodyHost.innerHTML = '<div class="confirmation-view">'
              + '<div class="confirm-icon">✓</div>'
              + '<div class="confirm-title">Reservation Confirmed!</div>'
              + '<div class="confirm-msg">' + esc(r.message || 'Your reservation has been recorded.') + '<br><br><strong>Reservation ID:</strong> ' + esc(r.registrationId) + '</div>'
              + '<div class="confirm-btns">'
              + '<button class="confirm-btn primary" id="btnConfirmCal">Back to Calendar</button>'
              + '<button class="confirm-btn" id="btnConfirmHome" onclick="window.top.location.href=\'https://wtfdc.org\'">Return to Home</button>'
              + '</div>'
              + '</div>';
            
            document.getElementById('btnConfirmCal').addEventListener('click', function(){
              closeModal(); load(true); loadSessions();
            });
          }
          else {errEl.textContent=(r && r.message) ? r.message : 'Something went wrong. Please try again.';}
        }).catch(function(){btn.disabled=false; btn.textContent=getReserveButtonText(ev); errEl.textContent='Connection error. Please try again.';});
      });
    }

    function renderSessions(){
      var area=document.getElementById('sessionsArea');
      if (!area) return;
      
      var sessions=(S.sessionsData && S.sessionsData.sessions) ? S.sessionsData.sessions : [];
      var filtered=sessions.filter(function(s){
        var typeLC=String(s.type || '').toLowerCase();
        var catLC=String(s.category || '').toLowerCase();
        var isShow=(typeLC==='event' || catLC==='performance');
        if(S.showClasses && !S.showShows && isShow) return false;
        if(S.showShows && !S.showClasses && !isShow) return false;
        return true;
      });
      
      var html='';
      if(!filtered.length){html='<div style="text-align:center;padding:24px 0;color:var(--muted);font-size:14px;">No sessions found.</div>';}
      else{
        html='<div class="sessions-grid">';
        filtered.forEach(function(s){
          var hasImg=s.imageUrl && s.imageUrl.trim();
          var sid=esc(s.sessionId);
          html += '<div class="session-card">'
            + (hasImg ? '<img class="session-card-img" src="'+esc(s.imageUrl)+'" alt="'+esc(s.title)+'" loading="lazy">' : '')
            + '<div class="session-card-body">'
            + '<div class="session-card-category">'+esc(s.category||s.type||'')+'</div>'
            + '<div class="session-card-title">'+esc(s.title)+'</div>'
            + (s.description ? '<div class="session-card-desc">'+esc(s.description)+'</div>' : '')
            + (s.costText ? '<div class="session-card-cost">'+esc(s.costText)+' per session</div>' : '')
            + '<button class="session-card-toggle" data-sid="'+sid+'">'+s.instances.length+(s.instances.length===1?' upcoming date':' upcoming dates')+' — view all</button>'
            + '<div class="session-instances" id="si-'+sid+'">'+buildInstanceRows(s.instances)+'</div>'
            + '</div></div>';
        });
        html += '</div>';
      }
      
      area.innerHTML=html;
      attachSessionListeners();
      broadcastHeight();
    }

    function buildInstanceRows(instances){
      if(!instances.length) return '<div style="font-size:13px;color:var(--muted);padding:8px 0;">No upcoming dates scheduled.</div>';
      return instances.map(function(ev){
        var k=registerEvent(ev);
        var isUpcoming = String(ev.status || '').trim().toLowerCase() === 'upcoming';
        var canReg = ev.isPublic && !ev.isFull && !ev.isPast && isUpcoming;
        var btnText = getReserveButtonText(ev);
        var statusBadge = ev.statusLabel
          ? '<span style="display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;'
            + 'background:' + esc(ev.statusColor) + '1a;'
            + 'color:' + esc(ev.statusColor) + ';'
            + 'border:1px solid ' + esc(ev.borderColor || ev.statusColor) + ';'
            + 'margin-bottom:4px;">' + esc(ev.statusLabel) + '</span>'
          : '';
        return '<div class="session-instance-row"'+(ev.isCancelled?' style="opacity:0.6;"':'')+'>'+
          '<div>'+
            '<div class="session-instance-date">'+esc(ev.dateLabel)+statusBadge+'</div>'+
            '<div class="session-instance-time">'+esc(ev.startTime)+' – '+esc(ev.endTime)+'</div>'+
            (ev.location ? '<div class="session-instance-spots">'+esc(ev.location)+'</div>' : '')+
            (ev.spotsText ? '<div class="session-instance-spots">'+esc(ev.spotsText)+'</div>' : '')+
          '</div>'+
          '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+
            (canReg ? '<button class="session-instance-btn primary btn-register" data-id="'+esc(k)+'">'+btnText+'</button>' : '')+
            '<button class="session-instance-btn btn-info" data-id="'+esc(k)+'">More Info</button>'+
          '</div>'+
        '</div>';
      }).join('');
    }

    function broadcastHeight(){
      try{
        var h=Math.max(document.body.scrollHeight, document.body.offsetHeight, document.documentElement.scrollHeight, document.documentElement.offsetHeight);
        window.parent.postMessage({type:'wingsHeight', height:h}, '*');
      }catch(e){}
    }

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if (e.target === this) closeModal();
    });

    document.getElementById('prevBtn').addEventListener('click', function(){if(S.view==='week'){S.currentMonday=addDays(S.currentMonday, -7); load();} else {var p=S.currentMonth.split('-'); S.currentMonth=monthKey(new Date(parseInt(p[0],10), parseInt(p[1],10)-2, 1)); load();}});
    document.getElementById('nextBtn').addEventListener('click', function(){if(S.view==='week'){S.currentMonday=addDays(S.currentMonday, 7); load();} else {var p=S.currentMonth.split('-'); S.currentMonth=monthKey(new Date(parseInt(p[0],10), parseInt(p[1],10), 1)); load();}});
    document.getElementById('viewWeek').addEventListener('click', function(){if(S.view==='week') return; S.view='week'; document.getElementById('viewWeek').classList.add('active'); document.getElementById('viewMonth').classList.remove('active'); load();});
    document.getElementById('viewMonth').addEventListener('click', function(){if(S.view==='month') return; S.view='month'; S.currentMonth=monthKey(S.currentMonday); document.getElementById('viewMonth').classList.add('active'); document.getElementById('viewWeek').classList.remove('active'); load();});
    document.getElementById('tabClasses').addEventListener('click', function(){S.showClasses=!S.showClasses; this.classList.toggle('active',S.showClasses); if(S.data) render(); if(S.sessionsData) renderSessions();});
    document.getElementById('tabShows').addEventListener('click', function(){S.showShows=!S.showShows; this.classList.toggle('active',S.showShows); if(S.data) render(); if(S.sessionsData) renderSessions();});

    attachCalendarListeners();
    load();
    broadcastHeight();
    if(window.ResizeObserver){new ResizeObserver(broadcastHeight).observe(document.body);}
  </script>
</body>
</html>
